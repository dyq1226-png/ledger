  <title>MultiCoin 记账</title>
  <style>/* MultiCoin 记账 App — 样式 */
:root {
  --bg: #0A0A0A;
  --bg-card: #1C1C1E;
  --bg-card-2: #2C2C2E;
  --bg-input: #2C2C2E;
  --text: #FFFFFF;
  --text-2: #98989F;
  --text-3: #636366;
  --accent: #0A84FF;
  --green: #30D158;
  --red: #FF453A;
  --orange: #FF9F0A;
  --separator: #38383A;
  --radius: 12px;
  --radius-lg: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

input, select, button, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none; margin: 0;
}

.loading {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100vh; gap: 16px;
  color: var(--text-2);
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--bg-card-2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 页面容器 ===== */
.page {
  min-height: 100vh;
  padding-top: var(--safe-top);
  max-width: 500px;
  margin: 0 auto;
}

/* ===== 导航栏 ===== */
.nav-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; height: 52px;
  position: sticky; top: var(--safe-top);
  background: var(--bg);
  z-index: 10;
}
.nav-bar h2 { font-size: 20px; font-weight: 700; }
.nav-btn {
  background: none; border: none; color: var(--accent);
  font-size: 18px; cursor: pointer; padding: 4px 8px;
}
.nav-save { font-weight: 600; }

/* ===== 首页头部 ===== */
.header {
  padding: 20px 20px 16px;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.header h1 {
  font-size: 14px; color: var(--text-2); font-weight: 500;
}
.total-amount {
  font-size: 40px; font-weight: 800; letter-spacing: -1px;
  margin-bottom: 4px;
}
.sub-amount {
  font-size: 14px; color: var(--text-2);
}

/* ===== 币种切换器 ===== */
.currency-switcher {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--bg-card);
  padding: 6px 12px; border-radius: 20px;
  cursor: pointer; font-size: 14px; font-weight: 600;
  transition: background 0.2s;
}
.currency-switcher:active { background: var(--bg-card-2); }
.cs-symbol { font-size: 16px; }
.cs-code { color: var(--text-2); }
.cs-arrow { font-size: 8px; color: var(--text-3); }

/* ===== 成员 Tab ===== */
.member-tabs {
  display: flex; gap: 8px; padding: 0 20px 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.member-tabs::-webkit-scrollbar { display: none; }
.member-tab {
  flex-shrink: 0;
  background: var(--bg-card); border: 1px solid transparent;
  color: var(--text-2); padding: 8px 16px; border-radius: 20px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  white-space: nowrap; transition: all 0.2s;
}
.member-tab.active {
  background: var(--accent); color: #fff;
}

/* ===== 区块 ===== */
.section {
  padding: 0 20px 20px;
}
.section-title {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 14px; color: var(--text-2); font-weight: 600;
  margin-bottom: 12px; text-transform: uppercase;
  letter-spacing: 0.5px;
}
.section-amount {
  color: var(--text); font-size: 16px; font-weight: 700;
  text-transform: none;
}
.empty-hint {
  color: var(--text-3); font-size: 14px; text-align: center;
  padding: 24px 0;
}

/* ===== 账户卡片 ===== */
.account-cards {
  display: flex; gap: 12px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  padding-bottom: 4px;
}
.account-cards::-webkit-scrollbar { display: none; }
.account-card {
  flex-shrink: 0; width: 140px;
  background: var(--bg-card); border-radius: var(--radius);
  padding: 16px; cursor: pointer;
  transition: transform 0.15s;
}
.account-card:active { transform: scale(0.96); }
.account-icon { font-size: 24px; margin-bottom: 8px; }
.account-name { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
.account-balance { font-size: 18px; font-weight: 700; }
.account-currency { font-size: 12px; color: var(--text-3); margin-top: 2px; }

/* ===== 分类条形图 ===== */
.category-breakdown { display: flex; flex-direction: column; gap: 10px; }
.cat-bar {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
}
.cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cat-name { width: 50px; flex-shrink: 0; }
.cat-bar-bg {
  flex: 1; height: 8px; background: var(--bg-card);
  border-radius: 4px; overflow: hidden;
}
.cat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.cat-amount { font-size: 12px; color: var(--text-2); flex-shrink: 0; }

/* ===== 交易列表 ===== */
.tx-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0;
  border-bottom: 0.5px solid var(--separator);
  cursor: pointer;
}
.tx-item:last-child { border-bottom: none; }
.tx-item:active { opacity: 0.7; }
.tx-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.tx-info { flex: 1; min-width: 0; }
.tx-title { font-size: 16px; font-weight: 600; }
.tx-meta {
  font-size: 12px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tx-member-dot {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; margin-right: 4px;
}
.tx-amount {
  font-size: 16px; font-weight: 700; flex-shrink: 0;
  text-align: right;
}

/* ===== Tab Bar ===== */
.tab-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 500px;
  display: flex; justify-content: space-around; align-items: center;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 6px 0 calc(6px + var(--safe-bottom));
  border-top: 0.5px solid var(--separator);
  z-index: 100;
}
.tab {
  background: none; border: none; color: var(--text-3);
  display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 4px 20px; cursor: pointer;
  font-size: 10px;
}
.tab.active { color: var(--accent); }
.tab-icon { font-size: 22px; }
.tab-label { font-size: 10px; }
.tab-add { flex: 0; }
.tab-add-btn {
  width: 48px; height: 48px;
  background: var(--accent); color: #fff;

<body>
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>
  </div>

  <script>/**
 * MultiCoin 记账 App — 数据层
 * 基于 IndexedDB 的本地持久化存储
 */

const DB_NAME = 'MultiCoinDB';
const DB_VERSION = 1;
const STORES = {
  transactions: 'transactions',
  accounts: 'accounts',
  categories: 'categories',
  members: 'members',
  rateCache: 'rateCache',
  settings: 'settings'
};

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORES.transactions)) {
        const s = d.createObjectStore(STORES.transactions, { keyPath: 'id' });
        s.createIndex('date', 'date');
        s.createIndex('member_id', 'member_id');
        s.createIndex('category_id', 'category_id');
        s.createIndex('account_id', 'account_id');
      }
      if (!d.objectStoreNames.contains(STORES.accounts)) {
        const s = d.createObjectStore(STORES.accounts, { keyPath: 'id' });
        s.createIndex('member_id', 'member_id');
      }
      if (!d.objectStoreNames.contains(STORES.categories)) {
        const s = d.createObjectStore(STORES.categories, { keyPath: 'id' });
        s.createIndex('parent_id', 'parent_id');
      }
      if (!d.objectStoreNames.contains(STORES.members)) {
        d.createObjectStore(STORES.members, { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains(STORES.rateCache)) {
        const s = d.createObjectStore(STORES.rateCache, { keyPath: 'id' });
        s.createIndex('date', 'date');
      }
      if (!d.objectStoreNames.contains(STORES.settings)) {
        d.createObjectStore(STORES.settings, { keyPath: 'key' });
      }
    };
  });
}

function tx(store, mode = 'readonly') {
  return db.transaction(store, mode).objectStore(store);
}

function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const r = tx(store).get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const r = tx(store).getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  });
}

function dbPut(store, obj) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readwrite').put(obj);
    r.onsuccess = () => resolve(obj);
    r.onerror = () => reject(r.error);
  });
}

function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readwrite').delete(key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

function dbClear(store) {
  return new Promise((resolve, reject) => {
    const r = tx(store, 'readwrite').clear();
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

// ===== Settings =====
async function getSetting(key, defaultVal) {
  const r = await dbGet(STORES.settings, key);
  return r ? r.value : defaultVal;
}
async function setSetting(key, value) {
  await dbPut(STORES.settings, { key, value });
}

// ===== Initialization =====
async function initData() {
  const initialized = await getSetting('initialized', false);
  if (initialized) return;

  // 预置成员
  const familyMember = {
    id: 'family',
    name: '全家',
    avatar: 'house.fill',
    color: '#F59E0B',
    is_family: true,
    sort_order: 0,
    is_archived: false,
    created_at: new Date().toISOString()
  };
  await dbPut(STORES.members, familyMember);

  // 预置分类
  const expenseCats = [
    { name: '餐饮', icon: 'fork.knife', color: '#EF4444' },
    { name: '交通', icon: 'car.fill', color: '#3B82F6' },
    { name: '购物', icon: 'bag.fill', color: '#EC4899' },
    { name: '住房', icon: 'house.fill', color: '#8B5CF6' },
    { name: '娱乐', icon: 'gamecontroller.fill', color: '#10B981' },
    { name: '医疗', icon: 'cross.case.fill', color: '#F97316' },
    { name: '教育', icon: 'book.fill', color: '#06B6D4' },
    { name: '旅行', icon: 'airplane', color: '#14B8A6' },
    { name: '其他', icon: 'ellipsis.circle', color: '#6B7280' }
  ];
  const incomeCats = [
    { name: '工资', icon: 'banknote', color: '#22C55E' },
    { name: '兼职', icon: 'briefcase.fill', color: '#84CC16' },
    { name: '理财收益', icon: 'chart.line.uptrend.xyaxis', color: '#0EA5E9' },
    { name: '红包', icon: 'gift.fill', color: '#E11D48' },
    { name: '其他', icon: 'ellipsis.circle', color: '#6B7280' }
  ];
  let order = 0;
  for (const c of expenseCats) {
    await dbPut(STORES.categories, {
      id: crypto.randomUUID(), name: c.name, icon: c.icon, color: c.color,
      type: 'expense', parent_id: null, sort_order: order++, is_archived: false
    });
  }
  order = 0;
  for (const c of incomeCats) {
    await dbPut(STORES.categories, {
      id: crypto.randomUUID(), name: c.name, icon: c.icon, color: c.color,
      type: 'income', parent_id: null, sort_order: order++, is_archived: false
    });
  }

  // 预置账户
  const defaultAccounts = [
    { name: '英镑现金', currency: 'GBP', type: 'cash', balance: 0 },
    { name: '人民币现金', currency: 'CNY', type: 'cash', balance: 0 },
    { name: '银行卡', currency: 'CNY', type: 'bank', balance: 0 }
  ];
  order = 0;
  for (const a of defaultAccounts) {
    await dbPut(STORES.accounts, {
      id: crypto.randomUUID(), name: a.name, currency: a.currency,
      type: a.type, balance: a.balance, member_id: null,
      sort_order: order++, is_archived: false, note: ''
    });
  }

  // 默认设置
  await setSetting('baseCurrency', 'CNY');
  await setSetting('displayCurrency', 'CNY');
  await setSetting('lastMemberId', 'family');
  await setSetting('initialized', true);
}

// ===== Transactions =====
async function getTransactions(filters = {}) {
  let all = await dbGetAll(STORES.transactions);
  all.sort((a, b) => new Date(b.date) - new Date(a.date));
  if (filters.memberId) all = all.filter(t => t.member_id === filters.memberId);
  if (filters.accountId) all = all.filter(t => t.account_id === filters.accountId);
  if (filters.categoryId) all = all.filter(t => t.category_id === filters.categoryId);
  if (filters.type) all = all.filter(t => t.type === filters.type);
  if (filters.startDate) all = all.filter(t => new Date(t.date) >= new Date(filters.startDate));
  if (filters.endDate) all = all.filter(t => new Date(t.date) <= new Date(filters.endDate));
  if (filters.currency) all = all.filter(t => t.currency === filters.currency);
  return all;
}

async function saveTransaction(t) {
  if (!t.id) t.id = crypto.randomUUID();
  if (!t.created_at) t.created_at = new Date().toISOString();
  await dbPut(STORES.transactions, t);
  // 更新账户余额
  await updateAccountBalance(t);
  return t;
}

async function deleteTransaction(id) {
  const t = await dbGet(STORES.transactions, id);
  if (t) {
    // 回滚账户余额
    const acct = await dbGet(STORES.accounts, t.account_id);
    if (acct) {
      let amountInAcctCurrency = t.amount;
      if (t.currency !== acct.currency) {
        const rateToAcct = await window.RateService.getRate(t.currency, acct.currency, t.rate_date);
        if (rateToAcct) amountInAcctCurrency = t.amount * rateToAcct;
      }
      if (t.type === 'expense') acct.balance += amountInAcctCurrency;
      else if (t.type === 'income') acct.balance -= amountInAcctCurrency;
      else if (t.type === 'transfer') {
        acct.balance += amountInAcctCurrency;
        if (t.to_account_id) {
          const toAcct = await dbGet(STORES.accounts, t.to_account_id);
          if (toAcct) {
            let toAmount = t.to_amount || t.amount;
            if (t.currency !== toAcct.currency && !t.to_amount) {
              const rateToTo = await window.RateService.getRate(t.currency, toAcct.currency, t.rate_date);
              if (rateToTo) toAmount = t.amount * rateToTo;
            }
            toAcct.balance -= toAmount;
            await dbPut(STORES.accounts, toAcct);
          }
        }
      }
      await dbPut(STORES.accounts, acct);
    }
  }
  await dbDelete(STORES.transactions, id);
}

async function updateAccountBalance(t) {
  const acct = await dbGet(STORES.accounts, t.account_id);
  if (!acct) return;
  // 将交易金额折算到账户币种
  let amountInAcctCurrency = t.amount;
  if (t.currency !== acct.currency) {
    // 使用交易保存的汇率进行折算：先转本位币，再转账户币种
    const rateToAcct = await window.RateService.getRate(t.currency, acct.currency, t.rate_date);
    if (rateToAcct) amountInAcctCurrency = t.amount * rateToAcct;
  }
  if (t.type === 'expense') acct.balance -= amountInAcctCurrency;
  else if (t.type === 'income') acct.balance += amountInAcctCurrency;
  else if (t.type === 'transfer') {
    acct.balance -= amountInAcctCurrency;
    await dbPut(STORES.accounts, acct);
    if (t.to_account_id) {
      const toAcct = await dbGet(STORES.accounts, t.to_account_id);
      if (toAcct) {
        let toAmount = t.to_amount || t.amount;
        if (t.currency !== toAcct.currency && !t.to_amount) {
          const rateToTo = await window.RateService.getRate(t.currency, toAcct.currency, t.rate_date);
          if (rateToTo) toAmount = t.amount * rateToTo;
        }
        toAcct.balance += toAmount;
        await dbPut(STORES.accounts, toAcct);
      }
      return;
    }
  }
  await dbPut(STORES.accounts, acct);
}

// ===== Accounts =====
async function getAccounts() {
  let all = await dbGetAll(STORES.accounts);
  all.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  return all.filter(a => !a.is_archived);
}
async function getAllAccounts() {
  let all = await dbGetAll(STORES.accounts);
  all.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  return all;
}
async function saveAccount(a) {
  if (!a.id) { a.id = crypto.randomUUID(); a.is_archived = a.is_archived || false; }
  await dbPut(STORES.accounts, a);
  return a;
}
async function deleteAccount(id) {

  if (a) { a.is_archived = true; await dbPut(STORES.accounts, a); }
}

// ===== Categories =====
async function getCategories(type = null) {
  let all = await dbGetAll(STORES.categories);
  all.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  let result = all.filter(c => !c.is_archived);
  if (type) result = result.filter(c => c.type === type);
  return result;
}
async function getAllCategories() {
  let all = await dbGetAll(STORES.categories);
  all.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  return all;
}
async function saveCategory(c) {
  if (!c.id) { c.id = crypto.randomUUID(); c.is_archived = c.is_archived || false; }
  await dbPut(STORES.categories, c);
  return c;
}
async function deleteCategory(id, migrateTo = null) {
  // 迁移历史交易
  const txns = await getTransactions();
  for (const t of txns) {
    if (t.category_id === id) {
      t.category_id = migrateTo;
      await dbPut(STORES.transactions, t);

  }
  await dbDelete(STORES.categories, id);
}
async function archiveCategory(id) {
  const c = await dbGet(STORES.categories, id);
  if (c) { c.is_archived = true; await dbPut(STORES.categories, c); }
}

// ===== Members =====
async function getMembers() {
  let all = await dbGetAll(STORES.members);
  all.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  return all.filter(m => !m.is_archived);
}
async function getAllMembers() {
  let all = await dbGetAll(STORES.members);
  all.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

}
async function saveMember(m) {
  if (!m.id) {
    m.id = crypto.randomUUID();
    m.is_family = false;
    m.is_archived = m.is_archived || false;
    m.created_at = new Date().toISOString();

  await dbPut(STORES.members, m);
  return m;
}
async function deleteMember(id, migrateTo = 'family') {
  if (id === 'family') return;
  const txns = await getTransactions();
  for (const t of txns) {
    if (t.member_id === id) {
      t.member_id = migrateTo;
      await dbPut(STORES.transactions, t);
    }
  }
  await dbDelete(STORES.members, id);
}
async function archiveMember(id) {
  if (id === 'family') return;
  const m = await dbGet(STORES.members, id);
  if (m) { m.is_archived = true; await dbPut(STORES.members, m); }
}

// ===== Rate Cache =====
async function getCachedRate(from, to, date) {
  const id = `${from}_${to}_${date}`;
  return await dbGet(STORES.rateCache, id);
}
async function saveCachedRate(from, to, rate, date) {
  const id = `${from}_${to}_${date}`;
  await dbPut(STORES.rateCache, {
    id, base_currency: from, quote_currency: to, rate, date, fetched_at: new Date().toISOString()
  });
}
async function getAllCachedRates() {
  return await dbGetAll(STORES.rateCache);
}

// Export for use
window.DB = {
  openDB, initData,
  getTransactions, saveTransaction, deleteTransaction,
  getAccounts, getAllAccounts, saveAccount, deleteAccount,
  getCategories, getAllCategories, saveCategory, deleteCategory, archiveCategory,
  getMembers, getAllMembers, saveMember, deleteMember, archiveMember,
  getCachedRate, saveCachedRate, getAllCachedRates,
  getSetting, setSetting
};

  <script>/**
 * MultiCoin 记账 App — 汇率服务
 * Frankfurter API + 本地缓存 + 离线降级
 */

const CURRENCIES = [
  { code: 'GBP', symbol: '£', name: '英镑', flag: '🇬🇧', priority: 0 },
  { code: 'CNY', symbol: '¥', name: '人民币', flag: '🇨🇳', priority: 0 },
  { code: 'USD', symbol: '$', name: '美元', flag: '🇺🇸', priority: 1 },
  { code: 'EUR', symbol: '€', name: '欧元', flag: '🇪🇺', priority: 1 },
  { code: 'JPY', symbol: '¥', name: '日元', flag: '🇯🇵', priority: 2 },
  { code: 'KRW', symbol: '₩', name: '韩元', flag: '🇰🇷', priority: 2 },
  { code: 'THB', symbol: '฿', name: '泰铢', flag: '🇹🇭', priority: 2 },
  { code: 'AUD', symbol: 'A$', name: '澳元', flag: '🇦🇺', priority: 2 }
];

const API_BASE = 'https://api.frankfurter.dev/v1';

async function fetchRatesFromAPI(base = 'GBP', date = null) {
  const symbols = CURRENCIES.filter(c => c.code !== base).map(c => c.code).join(',');
  const url = date
    ? `${API_BASE}/${date}?base=${base}&symbols=${symbols}`
    : `${API_BASE}/latest?base=${base}&symbols=${symbols}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`API error: ${resp.status}`);
  const data = await resp.json();
  return data.rates;
}

async function fetchAndCacheRates(baseCurrency) {
  try {
    const today = new Date().toISOString().split('T')[0];
    const rates = await fetchRatesFromAPI(baseCurrency);
    for (const [quote, rate] of Object.entries(rates)) {
      await DB.saveCachedRate(baseCurrency, quote, rate, today);
    }
    // 同时缓存反向汇率
    for (const [quote, rate] of Object.entries(rates)) {
      const reverseRate = 1 / rate;
      await DB.saveCachedRate(quote, baseCurrency, reverseRate, today);
    }
    // 缓存交叉汇率（通过 base 中转）
    const allCodes = [baseCurrency, ...Object.keys(rates)];
    for (const from of allCodes) {
      for (const to of allCodes) {
        if (from === to) continue;
        let rate;
        if (from === baseCurrency) rate = rates[to];
        else if (to === baseCurrency) rate = 1 / rates[from];
        else rate = rates[to] / rates[from];
        await DB.saveCachedRate(from, to, rate, today);
      }
    }
    await DB.setSetting('lastRateUpdate', new Date().toISOString());
    return rates;
  } catch (err) {
    console.warn('Failed to fetch rates:', err);
    return null;
  }
}

async function getRate(from, to, date = null) {
  if (from === to) return 1;
  const dateStr = date || new Date().toISOString().split('T')[0];
  // 查缓存
  const cached = await DB.getCachedRate(from, to, dateStr);
  if (cached) return cached.rate;
  // 尝试获取最新缓存
  const todayStr = new Date().toISOString().split('T')[0];
  if (dateStr !== todayStr) {
    const todayCached = await DB.getCachedRate(from, to, todayStr);
    if (todayCached) return todayCached.rate;
  }
  // 尝试 API
  try {
    const rates = await fetchRatesFromAPI(from, date);
    if (rates[to]) {
      await DB.saveCachedRate(from, to, rates[to], dateStr);
      return rates[to];
    }
  } catch (e) {
    // 离线，返回 null
  }
  return null;
}

async function convertAmount(amount, fromCurrency, toCurrency, date = null) {
  const rate = await getRate(fromCurrency, toCurrency, date);
  if (rate === null) return { amount: null, rate: null };
  return { amount: amount * rate, rate };
}

function formatCurrency(amount, currencyCode) {
  const cur = CURRENCIES.find(c => c.code === currencyCode);
  if (!cur) return `${amount.toFixed(2)}`;
  // 日元和韩元不显示小数
  if (currencyCode === 'JPY' || currencyCode === 'KRW') {
    return `${cur.symbol}${Math.round(amount).toLocaleString()}`;
  }
  return `${cur.symbol}${amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}`;
}

function getCurrencyInfo(code) {
  return CURRENCIES.find(c => c.code === code) || CURRENCIES[0];
}

async function ensureRatesFresh(baseCurrency) {
  const lastUpdate = await DB.getSetting('lastRateUpdate', null);
  const today = new Date().toISOString().split('T')[0];
  if (!lastUpdate || !lastUpdate.startsWith(today)) {
    await fetchAndCacheRates(baseCurrency);
  }
}

window.RateService = {
  CURRENCIES,
  fetchAndCacheRates,
  getRate,
  convertAmount,
  formatCurrency,
  getCurrencyInfo,
  ensureRatesFresh
};

  <script>/**

// ===== 全局状态 =====
const State = {
  currentPage: 'home',
  displayCurrency: 'CNY',
  baseCurrency: 'CNY',
  selectedMemberId: 'family',
  lastUsedCurrency: 'GBP',

};

// ===== 工具函数 =====
function uuid() { return crypto.randomUUID(); }
function todayISO() { return new Date().toISOString().split('T')[0]; }
function nowISO() { return new Date().toISOString(); }

function formatDate(dateStr) {
  const d = new Date(dateStr);
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return '今天';
  if (d.toDateString() === yesterday.toDateString()) return '昨天';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function formatDateFull(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

async function initApp() {
  await DB.openDB();
  await DB.initData();
  State.baseCurrency = await DB.getSetting('baseCurrency', 'CNY');
  State.displayCurrency = await DB.getSetting('displayCurrency', 'CNY');
  State.lastUsedMemberId = await DB.getSetting('lastMemberId', 'family');
  State.selectedMemberId = 'family';
  // 尝试更新汇率
  RateService.ensureRatesFresh(State.baseCurrency);
  render();
}

// ===== 导航 =====
async function navigate(page) {
  State.currentPage = page;
  if (page === 'add') {
    State.editingTransaction = null;
  }
  await render();
}

async function openEdit(tx) {
  State.editingTransaction = tx;
  State.currentPage = 'add';
  await render();
}

// ===== 主渲染入口 =====
async function render() {
  const app = document.getElementById('app');
  if (State.currentPage === 'home') await renderHome(app);
  else if (State.currentPage === 'add') await renderAddTransaction(app);
  else if (State.currentPage === 'reports') await renderReports(app);
  else if (State.currentPage === 'settings') await renderSettings(app);
}

// ===== 首页 =====
async function renderHome(container) {
  const accounts = await DB.getAccounts();
  const members = await DB.getMembers();
  const today = new Date();
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString();
  const allTx = await DB.getTransactions({ startDate: monthStart });

  // 按成员筛选

    ? allTx
    : allTx.filter(t => t.member_id === State.selectedMemberId);

  // 计算总资产
  let totalAssetsBase = 0;
  for (const a of accounts) {
    const { amount } = await RateService.convertAmount(a.balance, a.currency, State.baseCurrency);
    totalAssetsBase += amount || 0;
  }
  // 折算到显示币种
  const totalAssetsDisplay = await RateService.convertAmount(totalAssetsBase, State.baseCurrency, State.displayCurrency);

  // 本月支出
  const monthExpense = filteredTx.filter(t => t.type === 'expense');
  let monthExpenseBase = 0;
  for (const t of monthExpense) { monthExpenseBase += t.base_amount || 0; }
  const monthExpenseDisplay = await RateService.convertAmount(monthExpenseBase, State.baseCurrency, State.displayCurrency);

  // 最近交易
  const recentTx = (await DB.getTransactions()).slice(0, 15);
  const categories = await DB.getAllCategories();
  const catMap = {}; categories.forEach(c => catMap[c.id] = c);
  const memberMap = {}; members.forEach(m => memberMap[m.id] = m);

  container.innerHTML = `
    <div class="page home-page">

      <div class="section">

          ${accounts.length === 0 ? '<div class="empty-hint">暂无账户，去设置中添加</div>' :
            accounts.map(a => `

function getCategoryBreakdown(txns, catMap) {
  const map = {};
  for (const t of txns) {
    const cat = catMap[t.category_id] || { name: '其他', color: '#6B7280' };
    if (!map[t.category_id]) map[t.category_id] = { ...cat, amount: 0 };
    map[t.category_id].amount += t.base_amount || 0;
  }
  const arr = Object.values(map).sort((a, b) => b.amount - a.amount);
  const total = arr.reduce((s, i) => s + i.amount, 0);
  arr.forEach(i => i.percent = total > 0 ? Math.round(i.amount / total * 100) : 0);
  return arr;
}

function transactionItemHTML(t, catMap, memberMap) {
  const cat = catMap[t.category_id] || { name: '转账', icon: 'arrow.left.arrow.right', color: '#6B7280' };

  return `

      </div>
      <div class="tx-amount" style="color:${amountColor}">
        ${sign}${RateService.formatCurrency(t.amount, t.currency)}

    </div>
  `;
}

function accountIcon(type) {
  const icons = { cash: '💵', bank: '🏦', card: '💳', wallet: '👛', savings: ' Piggy Bank' };
  return icons[type] || '💰';

function sfSymbol(name) {
  // SF Symbol 映射到 emoji 简化处理
  const map = {
    'fork.knife': '🍔', 'car.fill': '🚗', 'bag.fill': '🛍️', 'house.fill': '🏠',

    'airplane': '✈️', 'ellipsis.circle': '📋', 'banknote': '💵', 'briefcase.fill': '💼',

      RateService.convertAmount(parseFloat(val) || 0, currency, baseCur, date).then(({ amount: conv, rate: r }) => {
        el.style.visibility = 'visible';

function saveFormDataAndRerender() {
  const editing = State.editingTransaction || {};
  editing.amount = parseFloat(document.getElementById('tx-amount')?.value) || editing.amount || 0;
  editing.currency = txCurrencyOverride || editing.currency || State.lastUsedCurrency;
  editing.note = document.getElementById('tx-note')?.value || editing.note || '';
  editing.date = document.getElementById('tx-date')?.value || editing.date || todayISO();
  const activeCat = document.querySelector('.cat-btn.active');
  if (activeCat) editing.category_id = activeCat.dataset.cat;
  const activeMember = document.querySelector('.member-pick-btn.active');
  if (activeMember) editing.member_id = activeMember.dataset.member;
  const acctSelect = document.getElementById('account-select');
  if (acctSelect) editing.account_id = acctSelect.value;
  const toAcctSelect = document.getElementById('to-account-select');
  if (toAcctSelect) editing.to_account_id = toAcctSelect.value;
  State.editingTransaction = editing;
  txCurrencyOverride = null;
  render();
}

async function saveTx() {
  const editing = State.editingTransaction || {};
  const type = document.querySelector('.seg-btn.active')?.dataset.type || 'expense';

  const amount = parseFloat(document.getElementById('tx-amount').value);
  if (!amount || amount <= 0) { showToast('请输入金额'); return; }

  const currency = txCurrencyOverride || editing.currency || State.lastUsedCurrency;
  const date = document.getElementById('tx-date').value;
  const note = document.getElementById('tx-note').value;
  const account_id = document.getElementById('account-select').value;
  const memberEl = document.querySelector('.member-pick-btn.active');
  const member_id = memberEl?.dataset.member || State.lastUsedMemberId;
  const catEl = document.querySelector('.cat-btn.active');
  const category_id = catEl?.dataset.cat || editing.category_id;

  if (type !== 'transfer' && !category_id) { showToast('请选择分类'); return; }

  // 获取汇率快照
  const { rate } = await RateService.convertAmount(amount, currency, State.baseCurrency, date);
  const base_amount = rate ? amount * rate : amount;

  const tx = {
    id: editing.id || uuid(),
    type,
    account_id,
    to_account_id: type === 'transfer' ? document.getElementById('to-account-select')?.value : null,
    category_id: type === 'transfer' ? null : category_id,
    member_id,
    amount,
    currency,
    exchange_rate: rate || 1,
    rate_date: date,
    base_amount,
    note,
    date: date + 'T' + new Date().toTimeString().split(' ')[0],
    created_at: editing.created_at || nowISO()
  };

  if (type === 'transfer') {
    const toAcct = await DB.getAccounts().then(a => a.find(x => x.id === tx.to_account_id));
    if (toAcct) {
      const { rate: toRate } = await RateService.convertAmount(amount, currency, toAcct.currency, date);
      tx.to_amount = toRate ? amount * toRate : amount;
    }
  }

  await DB.saveTransaction(tx);
  State.editingTransaction = null;
  txCurrencyOverride = null;
  showToast('保存成功');
  await navigate('home');
}

async function deleteTx(id) {
  if (!confirm('确认删除？')) return;
  await DB.deleteTransaction(id);
  State.editingTransaction = null;
  showToast('已删除');
  await navigate('home');
}

function editRate() {
  const newRate = prompt('手动修改汇率（当前币种 → 本位币）:');
  if (newRate && !isNaN(parseFloat(newRate))) {
    const rate = parseFloat(newRate);
    const today = todayISO();
    const currency = txCurrencyOverride || State.editingTransaction?.currency || State.lastUsedCurrency;
    DB.saveCachedRate(currency, State.baseCurrency, rate, today);
    saveFormDataAndRerender();
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000);
}

async function renderReports(container) {
  const members = await DB.getMembers();
  const f = State.reportsFilter;
  const today = new Date();
  let startDate, endDate;

  if (f.period === 'week') {
    const day = today.getDay() || 7;
    startDate = new Date(today); startDate.setDate(today.getDate() - day + 1);
    endDate = today;
  } else if (f.period === 'month') {
    startDate = new Date(today.getFullYear(), today.getMonth(), 1);
    endDate = today;
  } else {
    startDate = new Date(today.getFullYear(), 0, 1);
    endDate = today;
  }

  let txns = await DB.getTransactions({ startDate: startDate.toISOString(), endDate: endDate.toISOString() });
  if (f.memberId !== 'family') txns = txns.filter(t => t.member_id === f.memberId);

  const expenses = txns.filter(t => t.type === 'expense');
  const incomes = txns.filter(t => t.type === 'income');

  const totalExpense = expenses.reduce((s, t) => s + (t.base_amount || 0), 0);
  const totalIncome = incomes.reduce((s, t) => s + (t.base_amount || 0), 0);
  const balance = totalIncome - totalExpense;

  // 折算到报表币种
  const reportCur = f.currency || State.baseCurrency;
  const expConverted = await RateService.convertAmount(totalExpense, State.baseCurrency, reportCur);
  const incConverted = await RateService.convertAmount(totalIncome, State.baseCurrency, reportCur);
  const balConverted = await RateService.convertAmount(balance, State.baseCurrency, reportCur);

  const categories = await DB.getAllCategories();
  const catMap = {}; categories.forEach(c => catMap[c.id] = c);
  const catBreakdown = getCategoryBreakdown(expenses, catMap);

  // 成员支出
  const memberBreakdown = [];
  for (const m of members) {
    const mTx = txns.filter(t => t.type === 'expense' && t.member_id === m.id);
    const mTotal = mTx.reduce((s, t) => s + (t.base_amount || 0), 0);
    if (mTotal > 0) memberBreakdown.push({ ...m, amount: mTotal });
  }
  memberBreakdown.sort((a, b) => b.amount - a.amount);

  // 币种分布
  const currencyMap = {};
  for (const t of expenses) {
    if (!currencyMap[t.currency]) currencyMap[t.currency] = 0;
    currencyMap[t.currency] += t.base_amount || 0;
  }
  const curDist = Object.entries(currencyMap).map(([code, amount]) => ({
    code, amount, percent: totalExpense > 0 ? Math.round(amount / totalExpense * 100) : 0
  })).sort((a, b) => b.amount - a.amount);

  const totalAssetsBase = (await DB.getAccounts()).reduce(async (sumPromise, a) => {
    const sum = await sumPromise;
    const { amount } = await RateService.convertAmount(a.balance, a.currency, State.baseCurrency);
    return sum + (amount || 0);
  }, Promise.resolve(0));
  const totalAssets = await totalAssetsBase;

  container.innerHTML = `
    <div class="page reports-page">
      <div class="nav-bar">
        <h2>报表</h2>
        <div onclick="showReportsCurrencyPicker()">${currencySwitcherHTML('reportsCurrencyTemp', 'reports').replace('<div class="currency-switcher"', '<div class="currency-switcher" onclick="event.stopPropagation()"')}</div>
      </div>

      <div class="period-segment">
        <button class="seg-btn ${f.period === 'week' ? 'active' : ''}" onclick="setReportPeriod('week')">本周</button>
        <button class="seg-btn ${f.period === 'month' ? 'active' : ''}" onclick="setReportPeriod('month')">本月</button>
        <button class="seg-btn ${f.period === 'year' ? 'active' : ''}" onclick="setReportPeriod('year')">今年</button>
      </div>

      <div class="member-tabs">
        ${members.map(m => `
          <button class="member-tab ${f.memberId === m.id ? 'active' : ''}" onclick="setReportMember('${m.id}')">
            ${m.is_family ? '🏠' : ''} ${m.name}
          </button>
        `).join('')}
      </div>

      <div class="summary-cards">
        <div class="summary-card expense">
          <div class="sc-label">支出</div>
          <div class="sc-amount">${RateService.formatCurrency(expConverted.amount || 0, reportCur)}</div>
        </div>
        <div class="summary-card income">
          <div class="sc-label">收入</div>
          <div class="sc-amount">${RateService.formatCurrency(incConverted.amount || 0, reportCur)}</div>
        </div>
        <div class="summary-card balance">
          <div class="sc-label">结余</div>
          <div class="sc-amount">${RateService.formatCurrency(balConverted.amount || 0, reportCur)}</div>
        </div>
      </div>

      ${catBreakdown.length > 0 ? `
        <div class="section">
          <div class="section-title">支出分类</div>
          <div class="chart-container">
            <canvas id="cat-chart" width="300" height="200"></canvas>
          </div>
          <div class="legend">
            ${catBreakdown.slice(0, 6).map(c => `
              <div class="legend-item">
                <span class="legend-dot" style="background:${c.color}"></span>
                <span class="legend-name">${c.name}</span>
                <span class="legend-amount">${RateService.formatCurrency(c.amount, reportCur)}</span>
                <span class="legend-percent">${c.percent}%</span>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}

      ${memberBreakdown.length > 0 && f.memberId === 'family' ? `
        <div class="section">
          <div class="section-title">成员支出对比</div>
          <div class="member-bars">
            ${memberBreakdown.map(m => {
              const maxAmt = memberBreakdown[0].amount;
              const pct = maxAmt > 0 ? Math.round(m.amount / maxAmt * 100) : 0;
              const converted = RateService.convertAmount(m.amount, State.baseCurrency, reportCur);
              return `
                <div class="member-bar-item">
                  <div class="mb-info">
                    <span class="dot" style="background:${m.color}"></span>
                    <span>${m.is_family ? '🏠 ' : ''}${m.name}</span>
                  </div>
                  <div class="mb-bar-bg">
                    <div class="mb-bar-fill" style="width:${pct}%; background:${m.color}"></div>
                  </div>
                  <span class="mb-amount">${RateService.formatCurrency(m.amount, reportCur)}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      ` : ''}

      ${curDist.length > 0 ? `
        <div class="section">
          <div class="section-title">币种分布</div>
          <div class="currency-dist">
            ${curDist.map(c => `
              <div class="cd-item">
                <span class="cd-flag">${RateService.getCurrencyInfo(c.code).flag}</span>
                <span class="cd-code">${c.code}</span>
                <div class="cd-bar-bg"><div class="cd-bar-fill" style="width:${c.percent}%"></div></div>
                <span class="cd-percent">${c.percent}%</span>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}

      <div style="height:100px"></div>
      ${tabBarHTML('reports')}
    </div>
  `;

  // 渲染分类饼图
  if (catBreakdown.length > 0 && typeof Chart !== 'undefined') {
    const ctx = document.getElementById('cat-chart');
    if (ctx) {
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: catBreakdown.map(c => c.name),
          datasets: [{
            data: catBreakdown.map(c => c.amount),
            backgroundColor: catBreakdown.map(c => c.color),
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (ctx) => `${ctx.label}: ${RateService.formatCurrency(ctx.parsed, reportCur)}`
              }
            }
          },
          cutout: '60%'
        }
      });
    }
  }
}

          <button class="currency-option ${State.baseCurrency === c.code ? 'selected' : ''}" data-currency="${c.code}">
            <span class="cur-flag">${c.flag}</span>
            <span class="cur-info"><span class="cur-code">${c.code}</span><span class="cur-name">${c.name}</span></span>

            ${State.baseCurrency === c.code ? '<span class="cur-check">✓</span>' : ''}
          </button>
        `).join('')}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(() => overlay.classList.add('show'), 10);
  overlay.onclick = (e) => {
    if (e.target === overlay) { overlay.remove(); return; }
    const opt = e.target.closest('.currency-option');
    if (opt) {
      State.baseCurrency = opt.dataset.currency;
      DB.setSetting('baseCurrency', opt.dataset.currency);
      RateService.ensureRatesFresh(opt.dataset.currency);
      overlay.remove();
      render();
    }
  };
}

// ===== 导出 =====
async function exportData() {
  const txns = await DB.getTransactions();
  const cats = await DB.getAllCategories();
  const catMap = {}; cats.forEach(c => catMap[c.id] = c);
  const members = await DB.getAllMembers();
  const memberMap = {}; members.forEach(m => memberMap[m.id] = m);
  const accounts = await DB.getAllAccounts();
  const acctMap = {}; accounts.forEach(a => acctMap[a.id] = a);

  const rows = [['日期','类型','分类','成员','账户','金额','币种','汇率','本位币金额','备注']];
  for (const t of txns) {
    rows.push([
      t.date, t.type,
      catMap[t.category_id]?.name || '转账',
      memberMap[t.member_id]?.name || '',
      acctMap[t.account_id]?.name || '',
      t.amount, t.currency, t.exchange_rate, t.base_amount, t.note || ''
    ]);
  }
  const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `multicoin_${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出');
}
